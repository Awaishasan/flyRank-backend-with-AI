services:

  db:

    image: postgres:17

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

      - ./app/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:

    build: .

    ports:

      - "8000:8000"

    env_file:

      - .env

    depends_on:

      - db

volumes:

  postgres_data: